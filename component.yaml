platform: Common
buildPlatform:
displayName: Upload Files to Amazon S3
description: "Upload Files to Amazon S3."
inputs:
- key: "AC_INPUT_FILE_PATH"
  isRequired: false
  title: AWS Input File Path
  description:  Path to the file to be uploaded
  helpText:
- key: "AWS_ACCESS_KEY_ID"
  isRequired: false
  title: AWS Access Key Id
  description:  AWS Access Key Id
  helpText:
- key: "AWS_SECRET_ACCESS_KEY"
  isRequired: false
  title: AWS Secret Access Key
  description:  AWS Secret Access Key
- key: "AWS_BUCKET_NAME"
  isRequired: false
  title: AWS Bucket Name
  description:  AWS Bucket Name
- key: "AWS_BUCKET_REGION"
  defaultValue: "us-east-1"
  isRequired: false
  title: AWS Bucket Region
  description:  AWS Bucket Region
- key: "AWS_TARGET_DIR"
  isRequired: false
  title: Amazon S3 Folder Path in Bucket
  description:  Amazon S3 Folder Path in Bucket
- key: "AWS_ENDPOINT_URL_S3"
  isRequired: false
  title: S3 Endpoint URL
  description: "Endpoint of an S3-compatible storage such as MinIO, for example https://minio.example.com:9000. Leave empty for Amazon S3."
- key: "AC_AWS_CLI_BASE_URL"
  defaultValue: "https://awscli.amazonaws.com"
  isRequired: false
  title: AWS CLI Download Base URL
  description: "Base URL to download AWS CLI v2 from when it is not installed. Point it to your artifact proxy in air-gapped environments, for example https://nexus.example.com/repository/awscli."
outputs:
- key: "AC_AWS_UPLOAD_URL"
  defaultValue: $AC_AWS_UPLOAD_URL
  title: Amazon S3 Upload Url
  description: Amazon S3 Upload Url. (s3://your-bucket-name/timetsamp/your-upload-file)
  helpText:
processFilename: ruby
processArguments: '%AC_STEP_TEMP%/main.rb'
files:
- "main.rb"